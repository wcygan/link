syntax = "proto3";
package link.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/wcygan/link/gen/link/v1;linkv1";

// --- Request/Response Messages ---

// ShortenURL
message ShortenURLRequest {
  string original_url = 1;
  // Optional: custom code to use instead of auto-generated
  string custom_code = 2;
  // TTL in seconds; null or zero = no expiration
  int64 ttl_seconds = 3;
}
message ShortenURLResponse {
  // e.g. https://short.ly/Ab3k9
  string short_url = 1;
  string short_code = 2;
}

// RefreshPreview
message RefreshPreviewRequest {
  oneof by {
    string short_code = 1;
    string original_url = 2;
  }
}
message RefreshPreviewResponse {
  // Intentionally empty, confirms refresh was initiated.
}

// GetPreview
message GetPreviewRequest {
  oneof by {
    string short_code = 1;
    string original_url = 2;
  }
}
message GetPreviewResponse {
  string title = 1;
  string description = 2;
  string image_url = 3;
  google.protobuf.Timestamp fetched_at = 4;
}

// GenerateQRCode
message GenerateQRCodeRequest {
  string short_code = 1;
  int32 size = 2;
  string foreground_color = 3;
  string background_color = 4;
}
message GenerateQRCodeResponse {
  bytes png_data = 1;
  string content_type = 2;
}

// --- Service Definition ---

service UrlService {
  // Inserts (or returns existing) URL→code, kicks off preview.
  rpc ShortenURL(ShortenURLRequest) returns (ShortenURLResponse);

  // Force-starts the PreviewWorkflow for an existing link.
  rpc RefreshPreview(RefreshPreviewRequest) returns (RefreshPreviewResponse);

  // Reads the last persisted preview from TiDB.
  rpc GetPreview(GetPreviewRequest) returns (GetPreviewResponse);

  // Produces a QR code on-the-fly; no DB or Workflow.
  rpc GenerateQRCode(GenerateQRCodeRequest) returns (GenerateQRCodeResponse);
}